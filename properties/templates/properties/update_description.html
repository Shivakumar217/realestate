<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Description Update</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 50px;
        }

        .card {
            border: 1px solid #dcdcdc;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .custom-header {
            background-color:#8355c7;
            color: white;
            padding: 20px;
            border-radius: 10px 10px 0 0;
        }

        .property-title {
            font-size: 1.8em;
            font-weight: bold;
        }

        .property-address {
            font-size: 1.5em;
        }

        .card-body {
            padding: 20px;
        }

        .form-label {
            font-size: 1.2em;
            font-weight: bold;
        }

        .form-control {
            border-radius: 8px;
            font-size: 1em;
        }

        .btn-primary,
        .btn-secondary {
            border-radius: 8px;
            font-size: 1em;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="custom-header text-center">
                        <div>
                            <div class="property-title">PROPERTY</div>
                            <span class="property-address">{{ property.address }}</span>
                        </div>
                    </div>

                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label for="{{ form.description.id_for_label }}" class="form-label text-uppercase" style="color: black;">
                                    {{ form.description.label }}
                                    {% if form.description.field.required %}<span style="color: red;"> *</span>{% endif %}
                                </label>
                                {{ form.description }}
                                {% if form.description.errors %}
                                    <div class="invalid-feedback">
                                        {{ form.description.errors }}
                                    </div>
                                {% endif %}
                            </div>
                            

                            <div class="mb-3">
                                <button type="submit" class="btn btn-primary" style="background-color: #8355c7;">Update</button>
                                <a href="{% url 'saved-properties' %}" class="btn btn-secondary">Back</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js" integrity="sha384-DfXdz2eRFzpmW6Y1D9dQvIXhI5q7eRF8tUIvAGlT1bK0n9iG706jEXmdqTX8vvi" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-K+xSiW8z9Q5b/5lmE41z629bR+hHox2b8KMl/H+k7Y+C6SDW9J39Iu/m_z" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>

</html>
