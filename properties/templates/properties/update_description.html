<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Description Update</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="custom-header rounded text-black p-3">
                        <div class="text-center">
                            <div>
                                <large style="background-color: rgb(239, 192, 255); padding: 7px; border-radius: 5px;"><b>PROPERTY</b></large><br><br>
                                <span style="background-color: rgb(239, 192, 255); padding: 7px; border-radius: 5px; font-size: 1.5em;">{{ property.address }}</span>
                            </div>
                        </div>
                    </div>
                    
                    
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label for="{{ form.description.id_for_label }}" class="form-label text-uppercase">
                                    {{ form.description.label }}
                                    {% if form.description.field.required %}<span style="color: red;"> *</span>{% endif %}
                                {{ form.description }}
                                {% if form.description.errors %}
                                    
                                {% endif %}
                            </div>
                            
                            <div class="mb-3">
                                <button type="submit" class="btn btn-primary">Update</button>
                            </div>
                        </form>

                        <a href="{% url 'saved-properties' %}" class="btn btn-secondary">Back</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js" integrity="sha384-DfXdz2eRFzpmW6Y1D9dQvIXhI5q7eRF8tUIvAGlT1bK0n9iG706jEXmdqTX8vvi" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-K+xSiW8z9Q5b/5lmE41z629bR+hHox2b8KMl/H+k7Y+C6SDW9J39Iu/m_z" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
