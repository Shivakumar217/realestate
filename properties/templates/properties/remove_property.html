<!-- remove_property.html -->
{% extends 'base.html' %}

{% block content %}
<h2>Remove Property</h2>

<p>Are you sure you want to remove the property at {{ property.address }}?</p>

<!-- Button to trigger modal -->
<button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#confirmRemoveModal">
    Remove
</button>

<!-- Modal -->
<div class="modal fade" id="confirmRemoveModal" tabindex="-1" aria-labelledby="confirmRemoveModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmRemoveModalLabel">Confirm Removal</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to remove the property at {{ property.address }}?</p>
            </div>
            <div class="modal-footer">
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Remove</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </form>
            </div>
        </div>
    </div>
</div>

<a href="{% url 'saved-properties' %}">Cancel</a>
{% endblock %}
