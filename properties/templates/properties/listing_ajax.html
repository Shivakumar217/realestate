{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Listing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'js/zillow.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa; /* Bootstrap background color */
        }

        .container {
            background-color: #ffffff; /* Container background color */
            padding: 20px;
            margin-top: 50px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Bootstrap box shadow */
        }

        .btn-primary {
            background-color: #007bff; /* Bootstrap primary button color */
            border-color: #007bff;
        }

        .btn-secondary {
            background-color: #6c757d; /* Bootstrap secondary button color */
            border-color: #6c757d;
        }

        .table {
            background-color: #ffffff; /* Table background color */
        }

        .table th,
        .table td {
            border: 1px solid #dee2e6; /* Table border color */
        }

        .fixed-button-container {
            position: fixed;
            bottom: 10px;
            right: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center mt-5" style="color: #6600ff; font-family: 'Arial', sans-serif; font-weight: bold;">Zillow Property Search</h1>

        <div class="row mt-5">
            <div class="col-md-4">
                <form id="addToFavoritesForm">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="zipcode" class="form-label">Enter ZIP code:</label>
                        <input type="text" id="zipcode" name="zipcode" class="form-control" style="border: 1px solid #ced4da;">
                    </div>
                </form>
            </div>
            <div class="col-md-10">
                <button type="button" id="fetchProperties" class="btn btn-primary" style="background-color: #7e54bc; font-family: 'Arial', sans-serif; font-weight: bold;">Fetch Properties</button>
                <a href="{% url 'saved-properties' %}" class="btn btn-secondary" style="background-color: #7e54bc; font-family: 'Arial', sans-serif; font-weight: bold;">View Saved Properties</a>
            </div>
        </div>

        <table id="propertyTable" class="table table-striped mt-5">
            <thead>
                <tr>
                    <th>Address</th>
                    <th>ZPID</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
    </div>

    <!-- ... (existing code) -->
</body>

</html>
