{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Property Listing</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="{% static 'js/zillow.js' %}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <style>
                /* Add custom styles for the fixed button */
                .fixed-button-container {
                        position: fixed;
                        bottom: 10px;
                        right: 10px;
                }
        </style>
</head>

<body>
    <div class="container">
        <h1>Zillow Property Search</h1>

        <form id="addToFavoritesForm">
            {% csrf_token %}
            <label for="zipcode">Enter ZIP code:</label>
            <input type="text" id="zipcode" name="zipcode">
            <button type="button" id="fetchProperties">Fetch Properties</button>
        </form>

        <table id="propertyTable" class="table table-striped">
            <thead>
                <tr>
                    <th>Address</th>
                    <th>ZPID</th>
                </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>
    </div>

    <!-- ... (existing code) -->
</body>

</html>
